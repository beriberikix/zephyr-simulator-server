services:
  backend:
    image: ${BACKEND_IMAGE_REPO}:${BACKEND_IMAGE_TAG}
    env_file:
      - .env.production
    ports: []

  frontend:
    ports: []
    command: sh -c "npm ci && npm run dev -- --host 0.0.0.0 --port 5173"

  caddy:
    env_file:
      - .env.production
    volumes:
      - ./Caddyfile.prod:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
